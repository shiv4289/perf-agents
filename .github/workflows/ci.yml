# Runs on every push and PR: unit tests, then the full pipeline with the scripted fake LLM.
# No GPUs, models or secrets needed.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: local/ tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: local      # CI covers the local version; managed-agents needs an API key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (scoring math + guardrails)
        run: make test
      - name: Smoke test (agents + tools + oracle + evals, fake LLM)
        run: make smoke
      - name: Upload smoke leaderboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-leaderboard
          path: local/evals/results/
