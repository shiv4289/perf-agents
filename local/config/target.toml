# =============================================================================
# target.toml — the inference server being performance-tested
# =============================================================================
#
# This is the system UNDER TEST, not the models that run the agents.
#
# type = "mock"     Starts bench/mock_server.py on a free port for each run.
#                   No GPUs needed. Has a realistic saturation knee and OOMs.
#
# type = "command"  A real endpoint (e.g. an NAI vLLM deployment). Deploying a
#                   config runs `deploy_command` through the shell, then waits
#                   until `ready_url` answers 200.
# =============================================================================

type = "mock"

# The search space the agents may explore. Code enforces it: the executor's
# deploy tool rejects anything outside these lists.
[search_space]
tp        = [1, 2, 4, 8]          # tensor-parallel size = GPUs per replica
max_batch = [32, 64, 128, 256]    # vLLM --max-num-seqs

# Load sweep used for every config.
[sweep]
# Which load generator measures each config:
#   "builtin"           bench/loadgen.py: stdlib only, starts instantly, fine for CI and quick tries
#   "mlperf-endpoints"  MLCommons MLPerf Endpoints client: the industry-standard measurement
#                       (real datasets, MLPerf early-stopping p99). Install: make mlperf-setup
# Both write the same files, so nothing else changes. Override per run: --loadgen mlperf-endpoints
loadgen    = "builtin"
levels     = "16,32,64,128,192"   # concurrency levels, comma-separated
duration_s = 6                    # measured seconds per level (after warmup)
warmup_s   = 1                    # builtin only; MLPerf Endpoints handles its own
max_tokens = 64                   # output tokens per request (fixed, so configs compare fairly)

# Only used when loadgen = "mlperf-endpoints".
[sweep.mlperf_endpoints]
command    = ""                                    # "" = ./.venv-mlperf (make mlperf-setup), then PATH
dataset    = "bench/datasets/mixed_prompts.jsonl"  # JSONL with a "prompt" field; swap in your real traffic
tokenizer  = ""          # HF repo id or local path. "" = the mock's tokenizer, or the target model's name
api_type   = "openai"    # openai (/v1/chat/completions), openai-completions, or sglang
workers    = -1          # client worker processes; -1 = auto. Use 1-2 on small VMs
extra_args = []          # any other inference-endpoint flags, e.g. ["--no-early-stopping"]

# ---- Only used when type = "command" ----------------------------------------
[command]
url            = "https://my-endpoint.nai.local"   # base URL; loadgen calls {url}/v1/completions
model          = "llama-3-70b"                     # model name sent in the load requests
api_key_env    = "NAI_API_KEY"
# {tp} and {max_batch} are filled in. Example for a vLLM Deployment on Kubernetes:
deploy_command = "./scripts/deploy_vllm.sh --tp {tp} --max-num-seqs {max_batch}"
ready_url      = "https://my-endpoint.nai.local/health"
ready_timeout_s = 900
metrics_url    = "https://my-endpoint.nai.local/metrics"
