# --- Offline fake LLM used by `make smoke` (tests/fake_llm.py) ----------------
# Not a real model: it follows a fixed script so the plumbing can be tested
# without GPUs. Safe to leave here.
[models.fake]
base_url    = "http://127.0.0.1:8599/v1"
model       = "fake"
api_key_env = ""
temperature = 0.0
max_tokens  = 1024
