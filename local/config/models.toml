# =============================================================================
# models.toml — every LLM endpoint the agents are allowed to use
# =============================================================================
#
# Each [models.<name>] block is one OpenAI-compatible chat endpoint (vLLM, NAI,
# NIM, ...). The <name> is what you use in roles.toml, in --model overrides,
# and in evals/suite.toml.
#
# Fields:
#   base_url     URL up to and including /v1  (we call {base_url}/chat/completions)
#   model        the served model name (vLLM --served-model-name)
#   api_key_env  name of the env var holding the API key ("" = no auth)
#   temperature  lower = more deterministic; keep low for agents
#   max_tokens   cap on tokens the model may generate per turn
#   extra_body   optional table merged into every request body, for
#                server-specific knobs (e.g. chat_template_kwargs)
#
# >>> EDIT THE base_url VALUES TO YOUR NAI ENDPOINTS <<<
# Then run:  python3 -m perfagents check-models
# to confirm each endpoint answers and returns proper tool calls.
# =============================================================================

# --- Planner candidate: strong long-horizon agentic model ---------------------
# Reflection Beam: 501B total / 23B active MoE. Strong Terminal-Bench / SWE-bench
# results, so it is the default "brain" that decides what to test next.
[models.beam]
base_url    = "http://beam.nai.local/v1"
model       = "beam"
api_key_env = "NAI_API_KEY"
temperature = 0.2
max_tokens  = 4096

# --- Alternative planner / judge: Meta Muse Spark Open ------------------------
# 816B total / 42B active. Good at tool use. Default role here is the eval
# JUDGE (internal use only, so its license is not an issue for this).
[models.muse-spark]
base_url    = "http://muse-spark.nai.local/v1"
model       = "muse-spark"
api_key_env = "NAI_API_KEY"
temperature = 0.2
max_tokens  = 4096

# --- Specialists: fast and cheap ----------------------------------------------
# Nemotron 3.5 Lightning: 30B total / 3B active. Mechanical jobs (deploy, run a
# script, tabulate numbers) need speed more than deep reasoning.
# vLLM flags: --enable-auto-tool-choice --tool-call-parser qwen3_coder
#             --reasoning-parser nemotron_v3
[models.nemotron-lightning]
base_url    = "http://nemotron-lightning.nai.local/v1"
model       = "nemotron-3.5-lightning"
api_key_env = "NAI_API_KEY"
temperature = 0.1
max_tokens  = 4096

# Nemotron 3.5 Super: 120B total / 12B active. A step up in reasoning for the
# analyst, which writes analysis scripts and the final report.
[models.nemotron-super]
base_url    = "http://nemotron-super.nai.local/v1"
model       = "nemotron-3.5-super"
api_key_env = "NAI_API_KEY"
temperature = 0.1
max_tokens  = 4096

